<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindred Avatar - 3D Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #avatar-canvas {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            width: 400px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-indicator {
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 14px;
        }

        .status-indicator.thinking {
            background: rgba(255, 200, 0, 0.3);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 12px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .message.user {
            background: rgba(102, 126, 234, 0.6);
            align-self: flex-end;
            margin-left: auto;
        }

        .message.kindred {
            background: rgba(118, 75, 162, 0.6);
            align-self: flex-start;
        }

        #input-container {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
        }

        #message-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            flex: 1;
            font-size: 12px;
            padding: 10px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .connection-status {
            font-size: 12px;
            opacity: 0.7;
        }

        #avatar-label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="avatar-canvas">
            <div id="avatar-label">Kindred</div>
        </div>
        <div id="ui-panel">
            <div>
                <h1>Kindred Avatar</h1>
                <div class="connection-status" id="connection-status">Connecting...</div>
            </div>

            <div class="status-indicator" id="status-indicator">
                Ready
            </div>

            <div id="chat-container">
                <!-- Messages will appear here -->
            </div>

            <div id="input-container">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Talk to Kindred..."
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>

            <div class="controls">
                <button id="gen-image-btn">Generate Image</button>
                <button id="clear-btn">Clear Chat</button>
                <button id="voice-ui-btn" onclick="window.location.href='index_voice.html'">🎤 Voice UI</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
