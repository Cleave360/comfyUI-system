name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q scripts kindred-avatar/backend custom_nodes
      - run: pytest -q
      - name: Reject committed local evidence or secrets
        run: |
          test -z "$(git ls-files '.kindred/*' '.env' '*.pem' '*.key')"
      - name: Validate shell entry points
        run: zsh -n start_all.sh stop_all.sh status_all.sh
