schema_version = "governance.policy.v1"

[execution]
governed_execution_required = true
allow_raw_shell_in_dev = false
require_envelope = true
require_audit_append = true

[surfaces]
allowed_execution_surfaces = ["kindred_bash", "kindred_pty", "adaptive_api"]
allowed_agent_runtimes = ["codex", "copilot", "claude_code", "antigravity", "api_agent"]

[leases]
require_lease_for_agent_exec = true
require_lease_for_service_exec = true

[skills]
require_skills_verification = true
skills_verification_mode = "dev"

[enterprise]
require_ingress_contract = false
require_egress_policy = false
require_handoff_schema = false
